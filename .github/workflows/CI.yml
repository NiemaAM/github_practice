on:
  # Run tests on pushes and pull requests
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Continuous Integration
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test